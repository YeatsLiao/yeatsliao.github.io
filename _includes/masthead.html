<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="{{ '/' | relative_url }}"><span class="i18n-zh">主页</span><span class="i18n-en">Homepage</span></a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}">{% if link.title_zh %}<span class="i18n-zh">{{ link.title_zh }}</span><span class="i18n-en">{{ link.title }}</span>{% else %}{{ link.title }}{% endif %}</a></li>
          {% endfor %}
          <li class="masthead__menu-item"><a id="lang-toggle" class="lang-toggle-link" onclick="toggleSiteLang()" title="切换语言 / Switch language">EN</a></li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
