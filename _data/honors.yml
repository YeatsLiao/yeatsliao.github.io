# 荣誉与证书数据
# community 为社区荣誉，纯文字列表
# award_groups 为证书与奖项，按平台/来源分组，每组字段：
#   name:  分组名（zh/en 双语）
#   items: 证书列表，每条字段（组内按时间倒序排列，新的在前）：
#     name:   证书/奖项名称（zh/en 双语，必填）
#     period: 时间（必填，格式 yyyy-MM 或年份区间）
#     image:  证书图片路径（选填）。图片放 images/certs/{平台}/ 目录下（如 images/certs/aliyun/xxx.jpg），
#             把路径填到这里即可；不填则显示纯文字卡片。支持 jpg/png/webp/svg
# 新增证书：图片压缩后放对应平台目录，在对应分组 items 中按时间倒序插入条目即可

