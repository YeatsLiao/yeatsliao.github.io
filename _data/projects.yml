# 开源项目数据
# 新增项目：在 categories 下对应分类的 items 中追加条目即可，页面自动渲染
# 项目字段说明：
#   name:     项目名（必填）
#   link:     仓库/主页链接（必填，GitHub/AtomGit/Gitee 等任意平台都行）
#   desc:     一句话描述，zh/en 双语（必填）
#   tags:     技术栈标签列表（必填）
#   featured: true 时置顶到"精选项目"大卡区（建议保持 2-3 个）；其余项目统一紧凑小卡，不带封面
#   repo:     GitHub 仓库（用户名/仓库名），仅精选项目用于 OpenGraph 封面兜底，非 GitHub 项目不填
#   image:    项目截图，放 images/projects/ 下（选填，仅精选项目展示，优先于 OpenGraph）

categories:
  - id: ai
    name:
      zh: AI 应用
      en: AI Applications
    items:
      - name: emotion-sky
        repo: YeatsLiao/emotion-sky
        featured: true
        link: https://github.com/YeatsLiao/emotion-sky
        desc:
          zh: 情绪记录与可视化 Web 应用：将用户情绪映射为动态天气场景，支持城市情绪地图和趋势分析。
          en: "An emotion journaling and visualization web app: maps user emotions to dynamic weather scenes, with city emotion maps and trend analysis."
        tags: [React, Vite, Visualization]
      - name: xmov-cultural-guardian
        repo: YeatsLiao/xmov-cultural-guardian
        link: https://github.com/YeatsLiao/xmov-cultural-guardian
        desc:
          zh: 基于魔珐星云 SDK 的文化遗产数字守护者：数字人实时讲解与交互问答 Demo。
          en: "Digital guardian for cultural heritage built on the Xmov SDK: a demo of real-time digital-human narration and interactive Q&A."
        tags: [Digital Human, SDK, Interactive Q&A]
      - name: AI Agent Skill 系列
        repo: YeatsLiao/ascend-blog-skill
        link: https://github.com/YeatsLiao/ascend-blog-skill
        desc:
          zh: 面向 AI 编码智能体的技能封装：昇腾/鲲鹏技术博客创作（ascend-blog-skill、kunpeng-blog-skill）、技术写作（yeats-tech-skill）与日记（yeats-diary-skill）等。
          en: "Skill packages for AI coding agents: Ascend/Kunpeng tech blog writing (ascend-blog-skill, kunpeng-blog-skill), technical writing (yeats-tech-skill), journaling (yeats-diary-skill), and more."
        tags: [Python, Agent Skill, AI Writing]
      - name: mindnlp（社区贡献）
        repo: YeatsLiao/mindnlp
        link: https://github.com/YeatsLiao/mindnlp
        desc:
          zh: 基于 MindSpore 的 NLP/LLM 框架，兼容 HuggingFace 模型与数据集，参与社区代码贡献。
          en: A MindSpore-based NLP/LLM framework compatible with HuggingFace models and datasets; contributed code to the community.
        tags: [MindSpore, NLP, Open Source]

