---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    <footer style="text-align: center; padding: 1.5em 0 0.4em; color: #adb5bd; font-size: 0.8em;">
      <span id="busuanzi_container_site_pv" style="display: none;">
        <span class="i18n-zh">本站总访问量</span><span class="i18n-en">Total visits</span> <span id="busuanzi_value_site_pv"></span>
      </span>
      <span id="busuanzi_container_site_uv" style="display: none;">
        &nbsp;·&nbsp; <span class="i18n-zh">访客</span><span class="i18n-en">Visitors</span> <span id="busuanzi_value_site_uv"></span>
      </span>
    </footer>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <div class="mmv-wrap">
      <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=O2bfdqk_ty3y7Ef89vC-D2z4daefOL92JqUkKTGTIJo&cl=ffffff&w=a"></script>
    </div>

    {% include scripts.html %}

  </body>
</html>
